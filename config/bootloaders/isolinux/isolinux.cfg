# menu.cfg includes stdmenu.cfg and pulls in the generated live entry.
include menu.cfg
default vesamenu.c32
prompt 0
# 300 = 30 s, then boot the default entry.
timeout 300

menu background /isolinux/splash.png

# Selected-row colour. Stock syslinux (stdmenu.cfg, shipped by live-build) draws the
# highlighted row as a grey (#6d6d6d) bar with white text. Override it with the KubeOS
# lime and near-black text, the same #A3F000 the GRUB theme's select_*.png pixmaps use,
# so the BIOS and UEFI menus look alike.
#   menu color <element> <ansi-fallback> <foreground> <background>
# The four-digit background is #AARRGGBB, ff = fully opaque.
# 'sel' is the row, 'hotsel' the ^hotkey letter drawn inside it (it keeps its own
# colour otherwise), 'unsel' is left alone so the other entries stay as they are.
# This has to stay after "include menu.cfg": the last menu-color wins.
menu color sel    0;30;#050b05;#ffa3f000
menu color hotsel 1;30;#050b05;#ffa3f000

# Networking: static IP only, asked by the installer itself (Proxmox-style).
#
# netcfg/disable_autoconfig=true on the KERNEL COMMAND LINE is the documented way
# to skip DHCP entirely (netcfg.c: "always always always default back to
# autoconfig, unless you've specified disable_autoconfig on the command line").
# The same value is preseeded in preseed.cfg as a second safety net, so the
# installer goes straight to IP / netmask / gateway / DNS with no DHCP attempt and
# no "Network configuration method" prompt.

label install
    menu label KubeOS ^Install
	 menu default
	 kernel   /install/gtk/vmlinuz
   	 initrd  /install/gtk/initrd.gz
	 append @APPEND_LIVE@ locales=en_US.UTF-8 netcfg/disable_autoconfig=true

# KubeOS: the text-mode installer entry was removed on 2026-11-09 (user decision:
# graphical installer only). The palette overrides that lived here existed only
# to recolour the text installer's newt UI.

