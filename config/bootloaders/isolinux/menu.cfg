# No 'menu title': the branding lives in the splash art, and the title line
# was colliding with nothing useful while pushing the text rows around.
# stdmenu.cfg: colours, menu geometry
include stdmenu.cfg
# live.cfg: the "KubeOS Live" entry, generated by live-build from
# config/bootloaders/syslinux_common/live.cfg.in. Without this include the ISO has
# no live boot entry at all (the installer labels live in isolinux.cfg).
include live.cfg

menu clear
