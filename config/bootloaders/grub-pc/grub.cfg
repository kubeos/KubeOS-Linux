source /boot/grub/config.cfg

# 30 s timeout for both BIOS-GRUB and EFI-GRUB: `binary_grub-efi` reuses this same
# file (it relies on binary_grub_cfg to generate grub.cfg).
# Entry 0 is the installer, so the unattended default is the installer.
set default=0
set timeout=30

# --- Installer -----------------------------------------------------------------
# Networking is static-IP only, asked by the installer itself.
# netcfg/disable_autoconfig=true on the kernel command line is the documented way
# to make netcfg skip DHCP (netcfg.c: "always always always default back to
# autoconfig, unless you've specified disable_autoconfig on the command line").
# preseed.cfg sets the same value as a second safety net.
menuentry --hotkey=i 'KubeOS Install' {
    set background_color=black
    linux   /install/gtk/vmlinuz boot=live components quiet findiso=${iso_path} netcfg/disable_autoconfig=true
    initrd  /install/gtk/initrd.gz
    set gfxpayload=keep
}

# KubeOS: the text-mode installer entry was removed on 2026-11-09 by user
# decision. KubeOS ships the graphical (GTK) installer only, so the console
# palette overrides that only the text installer needed are gone with it, together
# with everything that supported them (config/includes.installer/etc/vtrgb,
# usr/bin/kubeos-vtrgb, usr/lib/main-menu.d/93-kubeos-vtrgb, the kbd package in
# installer.list.binary and the preseed/early_command that called the script).

# --- Live session --------------------------------------------------------------
# @KERNEL_LIVE@, @INITRD_LIVE@ and @APPEND_LIVE@ are substituted by
# binary_grub_cfg; @APPEND_LIVE@ already contains findiso=${iso_path} for ISO images.
# The live session keeps normal DHCP/NetworkManager behaviour.
menuentry --hotkey=l 'KubeOS Live' {
    set background_color=black
    linux  @KERNEL_LIVE@ @APPEND_LIVE@
    initrd @INITRD_LIVE@
    set gfxpayload=keep
}
