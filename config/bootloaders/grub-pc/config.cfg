if [ x$feature_default_font_path = xy ] ; then
   font=unicode
else
   font=$prefix/font.pf2
fi

if loadfont $font ; then
  set gfxmode=1280x720
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi

set color_normal=light-gray/black
set color_highlight=white/black

# KubeOS live menu theme: title "KubeOS", background ../splash.png.
# If the theme is missing, GRUB falls back to the plain text menu below.
set theme=/boot/grub/live-theme/theme.txt

terminal_output gfxterm
