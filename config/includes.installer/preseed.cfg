# Debian-installer preconfiguration (preseed) file
# https://wiki.debian.org/DebianInstaller/Preseed


### Console colours

# Nothing here any more: the text-mode installer was removed on 2026-11-09, and
# with it the console-palette rewrite (preseed/early_command running
# /usr/bin/kubeos-vtrgb, which applied /etc/vtrgb with setvtrgb from package kbd).
# The graphical installer paints its own theme, so it never used this. Do not
# re-add a palette command for a text installer that no longer boots.


### Network configuration - static IP only (Proxmox-style)

# netcfg picks an interface that has link, so there is no interface question on
# machines with more than one NIC.
d-i netcfg/choose_interface select auto

# KubeOS asks for a static address: IP, netmask, gateway and DNS. No DHCP attempt
# happens, so the "Network configuration method" prompt never appears either.
# A Kubernetes node needs an address that does not move: the API server
# certificate is issued for it, and a changed address breaks the node.
#
# The boot entries also pass netcfg/disable_autoconfig=true on the kernel command
# line (netcfg documents that as the only supported way to skip autoconfiguration),
# so this preseed line is a second safety net rather than the only mechanism.
d-i netcfg/disable_autoconfig boolean true
# netcfg/confirm_static is NOT preseeded on purpose: the user sees the summary of
# the address they typed before anything is applied.

# Pin the node name; delete this line to be asked for a hostname instead.
d-i netcfg/hostname string kubeos

# If non-free firmware is needed for the network hardware, load it without asking.
d-i hw-detect/load_firmware boolean true

# Include all drivers (generic system)
bootstrap-base base-installer/initramfs-tools/driver-policy select most

### Mirror settings
# If you select ftp, the mirror/country string does not need to be set.
#Use HTTPS protocol for mirrors
d-i mirror/protocol string https
d-i mirror/country string manual
d-i mirror/https/hostname string deb.debian.org
d-i mirror/https/directory string /debian/
d-i mirror/https/proxy string

### Account setup
# If set to false, skip creation of a root account (normal user account will be able to
# use sudo).
d-i passwd/root-login boolean true
# A normal user is NOT created any more (user decision 2026-11-09): KubeOS is a
# root-only appliance, so the installer asks for the root password and nothing
# else. user-setup's three prompts - passwd/user-fullname ("Full name for the new
# user"), passwd/username ("Username for your account") and passwd/user-password
# ("Choose a password for the new user") - come from this one key: it is
# `Create a normal user account now?`, default true, in the ISO's own
# user-setup-udeb 1.107 templates.
d-i passwd/make-user boolean false
# OPEN, user decision 2026-11-09: "I will see later about ssh". Debian's sshd
# defaults to PermitRootLogin prohibit-password and this image ships no sshd
# override, so on a machine installed from this ISO root cannot log in over SSH
# (openssh-server IS installed: config/package-lists/system.list.chroot). Console
# login as root works. Until that is decided, the node is console-only from a
# remote machine.

# The user account would be added to these groups; inert while make-user is
# false, kept here so the intent is not lost if a user ever comes back.
#d-i passwd/user-default-groups string sudo dialout fax cdrom floppy tape audio dip video plugdev fuse scanner netdev powerdev avahi

### Clock and time zone setup
# Controls whether or not the hardware clock is set to UTC.
d-i clock-setup/utc boolean true

# Controls whether to use NTP to set the clock during the install
d-i clock-setup/ntp boolean true
# NTP server to use. The default is almost always fine here.
d-i clock-setup/ntp-server pool.ntp.org

### Partitioning - fully guided, Proxmox-style (KubeOS)
#
# 2026-11-09, user decision - this supersedes the note that used to live here.
# The installer must ask for exactly five things - disk, swap size, root size,
# minfree and maxdata - and build the whole layout itself: GPT label, 1 MiB
# bios_grub area, EFI partition, LVM volume group, root and swap logical
# volumes. No guided / manual menu and no partition list may be shown.
# (Wording rule, same decision: swap and root are asked with a bare label and no
# explanation; only minfree and maxdata carry a one-line meaning.)
#
# The keys the old note forbade are therefore used now - but NOT in this file,
# because they depend on the user's answers. usr/lib/partman/init.d/
# 06-kubeos-layout asks the questions and then sets:
#   partman-auto/method                = lvm
#   partman-auto/disk                  = the disk the user picked
#   partman-partitioning/default_label = gpt
#   partman-auto/expert_recipe         = a recipe generated from swap + root
#   partman-auto-lvm/no_boot           = true  (no separate /boot: it is on the
#                                        root logical volume)
#   partman-auto-lvm/guided_size       = root + swap, which is what leaves the
#                                        rest of the volume group free for the
#                                        containerd thin pool created at first boot
# Setting expert_recipe alone already makes partman skip its recipe menu:
# recipes.sh choose_recipe() returns as soon as the recipe fits the disk.
#
# Do NOT preseed any of those six keys here. A static recipe cannot carry the
# user's sizes, and a static method/disk answer would bypass the questions.

# A reused disk may already carry LVM or software RAID: answer that prompt.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

# The LVM confirmation is deliberately NOT preseeded any more (it used to be
# "boolean true"). partman-auto-lvm ends with confirm_changes partman-lvm, and
# commit.sh asks one of two questions there: partman-lvm/confirm_nooverwrite on
# a fresh disk, or partman-lvm/confirm when the disk already had partitions.
# The old preseed silenced only the second one - re-installing over an existing
# disk, i.e. the case where the warning matters most. Both are now asked.
#d-i partman-lvm/confirm boolean true

# partman-auto-lvm/guided_size is no longer asked either: 06-kubeos-layout sets
# it to root+swap, because it decides how much of the volume group the logical
# volumes take and must match the numbers the user typed.
#d-i partman-auto-lvm/guided_size string max

# Writing a new empty partition table needs no extra prompt...
d-i partman-partitioning/confirm_write_new_label boolean true
# ...but the "write the changes to disks?" question is NOT preseeded, so d-i
# always asks before anything is destroyed.

#This makes swap partition disable warning
d-i partman-basicfilesystems/no_swap boolean false

# The efi-boot-lvm-root recipe that used to live here is gone: the layout is
# generated at run time from the user's sizes by 06-kubeos-layout.

### Apt setup

# Uncomment this if you don't want to use a network mirror.
d-i apt-setup/use_mirror boolean false

# Uncomment the following line, if you don't want to have the sources.list
# entry for a DVD/BD installation image active in the installed system
# (entries for netinst or CD images will be disabled anyway, regardless of
# this setting).
d-i apt-setup/disable-cdrom-entries boolean true

### Package selection
#tasksel tasksel/first multiselect standard

# Or choose to not get the tasksel dialog displayed at all (and don't install
# any packages):
#d-i pkgsel/run_tasksel boolean false

# Individual additional packages to install
#d-i pkgsel/include string openssh-server build-essential
# Whether to upgrade packages after debootstrap.
# Allowed values: none, safe-upgrade, full-upgrade
pkgsel pkgsel/upgrade select none

#Auto-accept Intel wireless drivers license
firmware-ipw2x00	firmware-ipw2x00/license/accepted	boolean	true

### Boot loader installation
# Grub is the default boot loader (for x86). If you want lilo installed
# instead, uncomment this:

# This is fairly safe to set, it makes grub install automatically to the MBR
# if no other operating system is detected on the machine.
d-i grub-installer/only_debian boolean true

# This one makes grub-installer install to the MBR if it also finds some other
# OS, which is less safe as it might not be able to boot that other OS.
d-i grub-installer/with_other_os boolean true

# Due notably to potential USB sticks, the location of the MBR can not be
# determined safely in general, so this needs to be specified:
#d-i grub-installer/bootdev  string /dev/sda
# To install to the first device (assuming it is not a USB stick):
d-i grub-installer/bootdev  string default

# GRUB force extra installation to the EFI removable media path
# https://web.archive.org/web/20190311184616/https://lists.debian.org/debian-user/2015/06/msg01517.html
grub-pc grub2/force_efi_extra_removable boolean true
# skip "continue without installing GRUB" debconf prompt
grub-pc	grub-pc/install_devices_empty	boolean	true

### Finishing up the installation

# During installations from serial console, the regular virtual consoles
# (VT1-VT6) are normally disabled in /etc/inittab. Uncomment the next
# line to prevent this.
#d-i finish-install/keep-consoles boolean true

# Avoid that last message about the install being complete.
d-i finish-install/reboot_in_progress note

# This will prevent the installer from ejecting the CD during the reboot,
# which is useful in some situations.
#d-i cdrom-detect/eject boolean false

# This is how to make the installer shutdown when finished, but not
# reboot into the installed system.
#d-i debian-installer/exit/halt boolean true
# This will power off the machine instead of just halting it.
#d-i debian-installer/exit/poweroff boolean true

#### Advanced options
### Running custom commands during the installation
# d-i preseeding is inherently not secure. Nothing in the installer checks
# for attempts at buffer overflows or other exploits of the values of a
# preconfiguration file like this one. Only use preconfiguration files from
# trusted locations! To drive that home, and because it's generally useful,
# here's a way to run any shell command you'd like inside the installer,
# automatically.

# This first command is run as early as possible, just after
# preseeding is read.
#d-i preseed/early_command string anna-install some-udeb
# This command is run immediately before the partitioner starts. It may be
# useful to apply dynamic partitioner preseeding that depends on the state
# of the disks (which may not be visible when preseed/early_command runs).
#d-i partman/early_command \
#       string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
# This command is run just before the install finishes, but when there is
# still a usable /target directory. You can chroot to /target and use it
# directly, or use the apt-install and in-target commands to easily install
# packages and run commands in the target system.
#d-i preseed/late_command string apt-install zsh; in-target chsh -s /bin/zsh

# KubeOS: everything the cluster needs that only WRITES files happens here, inside
# the installer, after GRUB is installed and before the reboot - behind the
# installation progress bar instead of in front of a black screen.
#
# TWO STEPS, ONE LINE, ON PURPOSE: debconf stores a single value per question, so a
# second `d-i preseed/late_command` line silently REPLACES the first instead of
# adding to it (measured 2026-11-11: the storage answers below disappeared from the
# installed machine). Everything that belongs in late_command must therefore be
# chained inside one value.
#
#   1. disk-layout answers: the partman hook (06-kubeos-layout) writes them to /tmp
#      in the installer's environment because /target does not exist yet at that
#      point; this is the first moment it does, and the same installer session is
#      still alive, so /tmp is readable here. First boot reads
#      /etc/kubeos/storage.conf to size the thin pool for pod data - without it,
#      kubeos-storage-init falls back to a fixed reserve.
#   2. cluster preparation: the per-machine PKI, the kubeconfigs, the kubelet and
#      kube-proxy configuration and the address file, chrooted into the new system
#      with `in-target`. First boot then has nothing left but starting the services,
#      which is the only part that needs the installed system actually running.
#
# `hostname` is set to the target's name first: inside the chroot the kernel still
# reports the live session's hostname, and kubeadm derives every certificate SAN and
# the kubelet's node name from it.
#
# `--pass-stdout` is not decoration: without it `in-target` sends the command's whole
# output to the installer's syslog only, so the log file below stays empty even when
# the prepare fails loudly (measured 2026-11-11).
#
# Both steps are best effort: if either fails the machine still boots, and
# node-setup generates everything itself at first boot (it verifies that the
# PKI belongs to this hostname/IP and regenerates it when it does not).
d-i preseed/late_command string { echo "=== kubeos late_command $(date) ==="; if [ -f /tmp/kubeos-storage.conf ]; then mkdir -p /target/etc/kubeos; cp /tmp/kubeos-storage.conf /target/etc/kubeos/storage.conf; chmod 0644 /target/etc/kubeos/storage.conf; echo "storage.conf: copied /tmp/kubeos-storage.conf"; else echo "storage.conf: WARNING /tmp/kubeos-storage.conf missing, first boot will use the default reserve"; fi; TARGET_HOST="$(head -n 1 /target/etc/hostname 2>/dev/null)"; echo "target hostname: ${TARGET_HOST:-unknown}"; if [ -n "$TARGET_HOST" ]; then hostname "$TARGET_HOST"; fi; in-target --pass-stdout /usr/bin/node-setup --prepare-only; echo "prepare rc=$?"; } >>/target/var/log/kubeos-prepare.log 2>&1; true
#d-i preseed/late_command string \
#    in-target sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="quiet"/GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"/' /etc/default/grub;#\
#    in-target grub-mkconfig -o /boot/grub/grub.cfg

# By default, the system's locate database will be updated after the
# installer has finished installing most packages. This may take a while, so
# if you don't want it, you can set this to "false" to turn it off.
#d-i pkgsel/updatedb boolean true
    
